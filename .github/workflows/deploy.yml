name: Deploy Shugon

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you redeploy by hand from the Actions tab

# Least privilege: read the repo, publish Pages, prove identity to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. cancel-in-progress is deliberately false: cancelling a
# half-finished Pages deploy is a good way to leave the site in a broken state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci, not npm install: installs exactly what package-lock.json pins,
      # so a deploy cannot quietly pick up a different dependency version than
      # the one that was tested locally.
      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      # The original single-page Trip HQ stays reachable at /alps-trip/legacy/.
      # Switching Pages to Actions stops serving the repo root, and that page is
      # the only thing the link already shared with people points at.
      - name: Keep the previous site at /legacy/
        run: |
          mkdir -p app/dist/legacy/images
          cp index.html app/dist/legacy/index.html
          cp images/*.jpg app/dist/legacy/images/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
